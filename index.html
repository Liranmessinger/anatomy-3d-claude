<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anatomy 3D</title>
<meta name="description" content="Interactive 3D human body atlas with quiz, simulation and guided journeys. Hebrew and English.">
<meta property="og:title" content="Anatomy 3D – human body atlas">
<meta property="og:description" content="Explore organs and body systems in 3D, run a live heart and lung simulation, and test yourself.">
<meta name="theme-color" content="#ff3b5c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23ff3b5c%27/%3E%3Cpath d=%27M4 17h6l3-7 5 13 3-6h7%27 stroke=%27white%27 stroke-width=%273%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<style>
:root{
  --bg1:#f6f8fc; --bg2:#d9e3f1; --card:rgba(255,255,255,.86); --card2:rgba(15,27,45,.045);
  --ink:#0f1b2d; --muted:#5d6b82; --line:rgba(15,27,45,.1); --accent:#ff3b5c; --accent2:#2b6cff; --onaccent:#fff;
  --shadow:0 18px 50px -18px rgba(25,45,95,.35); --gold:#b8860b; --factbg:rgba(255,184,0,.14);
}
body[data-theme=dark]{
  --bg1:#1a2745; --bg2:#070b16; --card:rgba(20,31,56,.84); --card2:rgba(255,255,255,.06);
  --ink:#eaf0ff; --muted:#9fb0cf; --line:rgba(255,255,255,.12); --accent:#ff5a78; --accent2:#6b97ff;
  --shadow:0 18px 50px -18px rgba(0,0,0,.7); --gold:#ffd25e; --factbg:rgba(255,210,94,.1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg2);color:var(--ink);font-family:"Inter","Segoe UI","Heebo","Assistant",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 35%,var(--bg1) 0%,var(--bg2) 85%)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

/* header */
#top{position:fixed;inset-block-start:0;inset-inline:0;display:flex;align-items:center;gap:10px;padding:14px 18px;z-index:6;pointer-events:none}
#top>*{pointer-events:auto}
.logo{display:flex;align-items:center;gap:10px;margin-inline-end:auto}
.logo i{width:38px;height:38px;border-radius:12px;background:var(--accent);display:grid;place-items:center;box-shadow:0 8px 20px -8px var(--accent)}
.logo svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo b{font-size:18px;letter-spacing:-.2px;display:block;line-height:1.1}
.logo small{display:block;color:var(--muted);font-size:12px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);backdrop-filter:blur(14px);display:flex;align-items:center}
.seg button{border:0;background:none;padding:7px 13px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.seg{padding:3px}
.seg button.on{background:var(--ink);color:var(--bg1)}
.ibtn{width:38px;height:38px;justify-content:center;border:1px solid var(--line);padding:0;cursor:pointer}
.ibtn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#vitals{padding:6px 14px;gap:14px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--line)}
#vitals span{display:flex;align-items:center;gap:6px}
#vitals small{font-weight:500;color:var(--muted);font-size:11px}
#vitals .hd{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:hb 1s infinite}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.5)}30%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#vitals .hd{animation:none}}

/* cards */
.card{position:fixed;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(16px);z-index:5}
#sheet{inset-block-start:76px;inset-inline-start:16px;width:330px;max-height:calc(100% - 180px);overflow:auto;padding:18px;display:none}
#info{inset-block-start:76px;inset-inline-end:16px;width:340px;max-height:calc(100% - 180px);overflow:auto;padding:20px}
.h1{font-size:22px;font-weight:800;letter-spacing:-.3px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.sec{font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;color:#0b1220;border:0;margin-bottom:10px}
.chip.btnlike{cursor:pointer}
#info h2{margin:0;font-size:28px;letter-spacing:-.5px;line-height:1.15}
#info .en{color:var(--muted);font-size:13px;margin:2px 0 14px}
.blk{margin:0 0 12px}
.blk b{display:block;font-size:11px;font-weight:700;color:var(--accent);margin-bottom:3px}
.blk p{margin:0;line-height:1.6}
.fact{background:var(--factbg);border-radius:14px;padding:11px 13px;margin-top:12px}
.fact b{color:var(--gold)}
.chips button{margin:0 0 6px;margin-inline-end:6px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-size:13px}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.search{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:inherit}
#results{list-style:none;margin:6px 0 0;padding:0}
#results button{display:block;width:100%;text-align:start;background:none;border:0;padding:8px 10px;border-radius:10px}
#results button:hover{background:var(--card2)}
.sys{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:12px}
.sys:hover{background:var(--card2)}
.sw{position:relative;width:34px;height:20px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:99px;background:rgba(120,130,150,.35);transition:background .2s}
.sw span:after{content:"";position:absolute;inset-block-start:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .2s}
.sw input:checked+span{background:var(--c)}
.sw input:checked+span:after{inset-inline-start:16px}
.sw input:focus-visible+span{outline:2px solid var(--accent2);outline-offset:2px}
.sys .nm{flex:1;font-weight:600;font-size:14px}
.sys .i{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none;font-size:12px;font-weight:700;padding:0;color:var(--muted)}
.sys .i:hover{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:8px;margin-top:10px}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.on{background:var(--ink);color:var(--bg1);border-color:var(--ink)}
.row .btn{flex:1}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted)}
.opt input[type=range]{width:120px;accent-color:var(--accent)}
.opt input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}

/* simulate */
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.gauge{background:var(--card2);border-radius:16px;padding:12px;text-align:center}
.gauge b{display:block;font-size:34px;line-height:1;letter-spacing:-1px}
.gauge span{font-size:12px;color:var(--muted)}
.gauge.h b{color:var(--accent)} .gauge.l b{color:var(--accent2)}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.acts .btn{padding:10px 6px;font-size:13px}
#simtext{margin:14px 0 0;line-height:1.6;color:var(--muted);font-size:14px}

/* quiz */
.qh{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:6px}
.bar{height:6px;border-radius:9px;background:var(--card2);overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qt{font-size:19px;font-weight:700;line-height:1.4;margin:0 0 14px}
.qt em{font-style:normal;color:var(--accent)}
.opts{display:grid;gap:8px}
.opts button{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);text-align:start;font-weight:600}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts .good{background:rgba(40,190,110,.25);border-color:#28be6e}
.opts .bad{background:rgba(255,59,92,.22);border-color:var(--accent)}
.fb{min-height:22px;margin-top:12px;font-weight:600}
.fb.good{color:#1c9a5a}.fb.bad{color:var(--accent)}
.big{font-size:52px;font-weight:800;letter-spacing:-2px;color:var(--accent);line-height:1}

/* nav */
#nav{position:fixed;inset-block-end:16px;inset-inline:0;margin:0 auto;width:max-content;max-width:calc(100% - 20px);padding:6px;gap:4px;z-index:7}
#nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 15px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted)}
#nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#nav button:hover{color:var(--ink)}
#nav button.on{background:var(--ink);color:var(--bg1)}

#tag{position:fixed;z-index:4;pointer-events:none;padding:4px 12px;border-radius:999px;background:var(--ink);color:var(--bg1);font-size:13px;font-weight:700;transform:translate(-50%,-150%);white-space:nowrap}
#tip{position:fixed;z-index:8;pointer-events:none;padding:4px 10px;border-radius:8px;background:var(--ink);color:var(--bg1);font-size:13px;font-weight:600;transform:translate(12px,-130%);display:none}
.help{position:fixed;inset-block-end:92px;inset-inline-end:18px;font-size:12px;color:var(--muted);z-index:3;max-width:230px;pointer-events:none;text-align:end}

#themeMenu{position:fixed;inset-block-start:64px;inset-inline-end:18px;z-index:9;padding:14px;width:300px;display:none}
#themeMenu h4{margin:0 0 10px;font-size:13px;color:var(--muted)}
#themeMenu .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#themeMenu button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;border:2px solid transparent;background:var(--card2);font-weight:600;font-size:13px;text-align:start}
#themeMenu button.on{border-color:var(--accent)}
#themeMenu i{width:28px;height:28px;border-radius:50%;flex:none;border:1px solid var(--line)}
.seg2{display:flex;gap:6px}
.seg2 button{flex:1;padding:8px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:600;font-size:13px}
.seg2 button.on{background:var(--ink);color:var(--bg1);border-color:var(--ink)}
.jcard{display:block;width:100%;text-align:start;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card2);margin-bottom:10px}
.jcard:hover{border-color:var(--accent)}
.emerg{background:rgba(255,59,92,.12);border:1px solid var(--accent);border-radius:12px;padding:9px 11px;font-size:13px;margin:10px 0;line-height:1.5}
#p-conditions details{border-top:1px solid var(--line);padding:9px 0}
#p-conditions summary{font-weight:700;cursor:pointer}
#p-conditions details ul{margin:8px 0 0;padding-inline-start:20px;line-height:1.6;font-size:14px}
.spk{float:inline-end;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);display:inline-grid;place-items:center;padding:0;margin-inline-start:8px;color:var(--ink)}
.spk:hover{border-color:var(--accent);color:var(--accent)}
.spk svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spk .i-stop{display:none}
body.speaking .spk .i-stop{display:block}
body.speaking .spk .i-play{display:none}
body.speaking .spk{border-color:var(--accent);color:var(--accent)}
#bNarr.on{background:var(--accent);border-color:var(--accent)}
#bNarr.on svg{stroke:#fff}
#toast{position:fixed;inset-block-start:70px;inset-inline:0;margin:0 auto;width:max-content;max-width:calc(100% - 28px);z-index:30;background:var(--ink);color:var(--bg1);padding:10px 16px;border-radius:14px;font-size:14px;display:none;box-shadow:var(--shadow);line-height:1.5}
/* modal */
#modal{position:fixed;inset:0;background:rgba(8,14,28,.55);backdrop-filter:blur(4px);z-index:20;display:none;align-items:center;justify-content:center;padding:14px}
#modal .box{width:min(920px,100%);max-height:100%;overflow:auto;background:var(--modal,var(--bg1));color:var(--ink);border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:var(--shadow)}

.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.tabs button{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:none;font-weight:600}
.tabs button.on{background:var(--ink);color:var(--bg1);border-color:var(--ink)}
#modal h2{margin:0 0 8px;font-size:26px;letter-spacing:-.4px}
#modal h4{margin:18px 0 4px;color:var(--accent)}
#modal p,#modal li{line-height:1.7}
.levels{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.levels div{flex:1 1 130px;background:var(--card2);border-radius:16px;padding:12px;font-size:13px;line-height:1.5}
.levels b{display:block;font-size:15px;color:var(--accent);margin-bottom:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cc{border-radius:18px;padding:14px;background:var(--card2);border-block-start:5px solid}
.cc h4{margin:0 0 4px;color:var(--ink)}
.cc p{margin:0 0 8px;font-size:14px;line-height:1.55}

.grip{display:none;position:sticky;inset-block-start:38px;height:0;z-index:3;justify-content:flex-end;gap:6px}
.grip button{position:relative;inset-block-start:-38px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;color:var(--ink)}
.grip svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#stage{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{-webkit-tap-highlight-color:transparent}
/* tablets in landscape: narrower side panels */
@media (min-width:901px) and (max-width:1100px) and (orientation:landscape){
  #sheet,#info{width:285px;padding:14px}
  #info h2{font-size:24px}
  .help{display:none}
}
/* phones and tablets in portrait: bottom sheets */
@media (max-width:900px) and (min-height:521px), (max-width:1100px) and (orientation:portrait){
  :root{--navh:64px}
  #top{padding:max(8px,env(safe-area-inset-top)) 10px 8px;gap:6px}
  .logo i{width:34px;height:34px;border-radius:11px}
  .logo small{display:none}
  .logo b{font-size:15px}
  #vitals{padding:5px 10px;gap:10px;font-size:13px}
  #vitals small{display:none}
  .seg button{padding:6px 10px}
  .ibtn{width:34px;height:34px}
  .help{display:none}
  #sheet,#info{inset-block-start:auto;inset-block-end:calc(var(--navh) + 14px + env(safe-area-inset-bottom));inset-inline:8px;width:auto;max-width:640px;margin-inline:auto;max-height:44vh;max-height:44dvh;padding:44px 14px 14px;border-radius:20px}
  #sheet.tall,#info.tall{max-height:78vh;max-height:78dvh}
  body.sheetOpen #info{display:none}
  #info.dismissed{display:none}
  .grip{display:flex}
  #info h2{font-size:22px}
  #nav{inset-inline:8px;width:auto;max-width:560px;margin-inline:auto;inset-block-end:max(8px,env(safe-area-inset-bottom));justify-content:space-around;gap:0;padding:4px}
  #nav button{flex:1;min-width:0;padding:6px 2px;font-size:10px}
  #nav button svg{width:20px;height:20px}
  #nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #themeMenu{inset-inline:10px;inset-block-start:56px;width:auto;max-width:340px;margin-inline-start:auto}
  #modal{padding:8px;align-items:flex-end}
  #modal .box{padding:16px;border-radius:20px;max-height:90vh;max-height:90dvh}
  #modal h2{font-size:21px}
  .cards{grid-template-columns:1fr}
  .tabs button{padding:7px 12px;font-size:13px}
  .search{font-size:16px}
  #toast{inset-block-start:60px}
}
@media (max-width:560px){.logo div{display:none}}
@media (max-width:380px){.seg button{padding:6px 8px}#vitals{padding:5px 8px;gap:8px}}
/* landscape phones: compact side panels */
@media (max-height:520px) and (orientation:landscape){
  #top{padding:6px 10px;gap:6px}
  .logo small,.logo b{display:none}
  .logo i{width:30px;height:30px}
  #vitals{padding:4px 10px;font-size:13px}#vitals small{display:none}
  .ibtn{width:32px;height:32px}.seg button{padding:5px 9px}
  #sheet,#info{inset-block-start:50px;width:min(300px,42%);max-height:calc(100% - 110px);padding:12px}
  #sheet{inset-inline-start:8px}#info{inset-inline-end:8px}
  body.sheetOpen #info{display:none}
  #nav{inset-block-end:6px;padding:3px}
  #nav button{padding:5px 14px}
  #nav button span{display:none}
  .help{display:none}
  #modal{padding:8px}#modal .box{padding:14px;max-height:96vh}
  #themeMenu{inset-block-start:50px}
  #toast{inset-block-start:52px}
}
/* touch-friendly sizes */
@media (pointer:coarse){
  .btn{min-height:42px}
  .sys{padding:8px 4px}
  .sys .i{width:34px;height:34px}
  .chips button{padding:8px 14px}
  #results button{padding:11px 10px}
  .seg2 button{padding:11px 6px}
  .sw{width:46px;height:26px}
  .sw span:after{width:20px;height:20px}
  .sw input:checked+span:after{inset-inline-start:22px}
  .opt input[type=checkbox]{width:22px;height:22px}
  .spk{width:40px;height:40px}
}
</style>
</head>
<body data-theme="light">
<div id="stage"></div>

<header id="top">
  <div class="logo"><i><svg viewBox="0 0 24 24"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg></i><div><b data-i18n="app"></b><small data-i18n="tagline"></small></div></div>
  <div class="pill" id="vitals" role="button" tabindex="0"><span><i class="hd"></i><b id="bpm">72</b><small data-i18n="bpmU"></small></span><span><b id="brpm">14</b><small data-i18n="brU"></small></span></div>
  <div class="pill seg" id="langseg"><button data-lang="he">עב</button><button data-lang="en">EN</button></div>
  <button class="pill ibtn" id="bNarr" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
  <button class="pill ibtn" id="bTheme" aria-label="Theme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.4-.6-.4-1 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4.1-4-7.5-9-7.5z"/><path d="M7.5 11h.01M10 7.5h.01M14.5 7.5h.01"/></svg></button>
</header>

<section id="sheet" class="card" aria-live="polite">
  <div id="p-explore">
    <input id="search" class="search" type="search" data-i18n-ph="search">
    <ul id="results"></ul>
    <div class="sec" data-i18n="systems"></div>
    <div id="syslist"></div>
    <div class="row"><button class="btn" id="bAll" data-i18n="showAll"></button><button class="btn" id="bNone" data-i18n="hideAll"></button></div>
    <label class="opt"><span data-i18n="skin"></span><input id="skinOp" type="range" min="0.04" max="0.85" step="0.01" value="0.14"></label>
    <label class="opt"><span data-i18n="dim"></span><input id="dimChk" type="checkbox" checked></label>
    <label class="opt"><span data-i18n="auto"></span><input id="autoChk" type="checkbox"></label>
    <div id="settingsBox"></div>
    <div class="row"><button class="btn" id="bReset" data-i18n="reset"></button></div>
  </div>

 liver:{deep:`הדם מהמעיים מגיע לכבד דרך וריד השער, כך שהכבד "בודק" כל מה שנספג לפני שהוא מגיע לשאר הגוף.`,adv:`הכבד מבצע מאות תפקידים: מפרק תרופות ואלכוהול, הופך אמוניה לשתנן, מייצר אלבומין וגורמי קרישה, ואוגר גליקוגן (סוכר מאוחסן).`},
 kidneys:{deep:`יחידת הסינון הבסיסית היא הנפרון: הדם מסונן בכדור נימים (גלומרולוס), והגוף מחזיר את רוב המים והחומרים החשובים. בכל כליה כמיליון נפרונים.`,adv:`הכליות מפרישות גם אריתרופואטין (מעורר ייצור כדוריות דם אדומות) ורנין (מווסת לחץ דם), ומפעילות ויטמין D.`},
 stomach:{deep:`תאי הקיבה מפרישים חומצת מלח, אנזים לפירוק חלבונים (פפסין) וריר מגן. החומציות גם הורגת חלק מהחיידקים שנכנסו עם האוכל.`,adv:`הקיבה מפרישה גם "גורם פנימי", שנחוץ לספיגת ויטמין B12 במעי. הפרשת החומצה מווסתת על ידי ההורמון גסטרין ועל ידי עצב הוואגוס.`},
 smallint:{deep:`המעי הדק מחולק לשלושה חלקים: התריסריון (כאן מתערבבים מרה ואנזימי הלבלב), הג׳חנון והמעי העקום, שבהם נספגים רוב החומרים.`,adv:`סוכרים וחומצות אמינו נספגים לנימי דם ומגיעים לכבד דרך וריד השער, ואילו שומנים נספגים בעיקר לכלי לימפה זעירים בתוך הסיסים.`},
 pancreas:{deep:`רוב הלבלב מייצר אנזימי עיכול. אזורים קטנים בתוכו, "איי לנגרהנס", מייצרים הורמונים.`,adv:`תאי בטא מפרישים אינסולין (מוריד סוכר בדם) ותאי אלפא מפרישים גלוקגון (מעלה סוכר בדם). שני ההורמונים פועלים בניגוד ושומרים על איזון.`},
 thyroid:{deep:`ההורמונים של בלוטת התריס, תירוקסין (T4) וטריודוטירונין (T3), משפיעים על כמעט כל תא בגוף: על קצב הלב, חום הגוף והצמיחה.`,adv:`ההפרשה מווסתת בלולאת משוב: כשרמת ההורמון בדם נמוכה, ההיפופיזה מפרישה TSH ובלוטת התריס מגיבה.`},
 spleen:{deep:`בטחול יש "עיסה אדומה" שמסננת דם ישן, ו"עיסה לבנה" שבה יושבים תאי חיסון.`,adv:`הטחול מסלק כדוריות דם אדומות ישנות ומחזיר את הברזל מהן לשימוש חוזר.`},
 spine:{deep:`עמוד השדרה מחולק לצוואר (7 חוליות), חזה (12), מותן (5), עצה וזנב (חוליות מחוברות).`,adv:`בין החוליות יוצאים 31 זוגות עצבי שדרה. פגיעה בחוט השדרה בגובה מסוים משפיעה על התחושה והתנועה מתחת לאותו גובה.`}
};

E('skull','A hard bony case that surrounds the brain and shapes the face. It is made of 22 bones joined by seams called sutures.','Protects the brain, eyes and ears, and its movable jaw lets you chew.','Mostly mesoderm, plus neural crest cells.',"A baby's skull bones are not fully fused yet, so the head can squeeze through birth and keep growing.",'Protects the brain like a helmet');
E('spine','A stack of 33 vertebrae (24 of them movable) with soft discs in between.','Supports the body, lets you bend and twist, and protects the spinal cord.',EM,'You are about a centimetre taller in the morning than at night, because the discs compress during the day.','Supports the body and shields the spinal cord');
E('ribs','Twelve pairs of ribs that form a cage around the heart and lungs.','Protects the heart and lungs, and moves as you breathe.',EM,'The lowest ribs are called "floating ribs" because they do not attach to the breastbone.','A cage that protects the heart and lungs');
E('sternum','A flat bone in the middle of the chest where most ribs connect.','Holds the rib cage together at the front and shields the heart.',EM,'It is full of blood-making bone marrow, so doctors sometimes sample marrow from it.','Flat bone in the chest that shields the heart');
E('clavicle','A thin, horizontal bone between the breastbone and the shoulder.','Works like a strut: it keeps the shoulder away from the body so the arm can move freely.',EM,'It is one of the bones most often broken in falls.','A strut between the chest and the shoulder');
E('humerus','A long bone in the upper arm, between the shoulder and the elbow.','Acts as a lever that muscles pull on to move the arm.',EM,'The "funny bone" tingle is actually a nerve passing close to the skin at the elbow.','The long bone of the upper arm');
E('forearm','Two bones (radius and ulna) between the elbow and the wrist.','Let you rotate your hand palm-up and palm-down.',EM,'When you turn your palm over, the two bones cross each other.','Two bones between the elbow and the hand');
E('hand','27 small bones: the wrist, palm and fingers.','Allow precise grip and the use of tools.',EM,'Your two hands together hold about a quarter of all the bones in your body.','27 bones that allow grip');
E('pelvis','A wide ring of bone at the base of the spine.','Carries the weight of the upper body, protects organs in the lower abdomen and connects the legs to the trunk.',EM,'The pelvis is one of the clearest differences between male and female skeletons.','A bony ring that connects the legs to the body');
E('femur','The longest, strongest and heaviest bone in the body.','Carries the body\'s weight and makes walking and running possible.',EM,'It is about a quarter of your total height.','The longest, strongest bone in the body');
E('tibia','The lower leg has two bones: the tibia (thick) and the fibula (thin).','The tibia carries most of the weight; the fibula steadies the ankle.',EM,'The tibia is the second-largest bone in the body.','Thick shin bone below the knee that bears weight');
E('foot','26 bones arranged in arches.','Act like a spring: they absorb shock when you walk and push you forward.',EM,'Your two feet together hold about a quarter of the body\'s bones.','26 bones with a springy arch');
E('pectoral','A large, flat muscle in the upper chest.','Pulls the arm inward and rotates it, as in pushing or hugging.',EM,'Muscles work in pairs: one pulls, the other pulls back.','Pulls the arm forward, like a hug');
E('deltoid','A triangular muscle that wraps around the shoulder.','Lifts the arm out to the side and forward.',EM,'Its name comes from the Greek letter delta (Δ), because of its shape.','Lifts the arm sideways');
E('biceps','A muscle on the front of the upper arm with two "heads".','Bends the elbow and turns the palm up.',EM,'"Biceps" is Latin for "two-headed".','Bends the elbow');
E('abs','Long muscles divided into "blocks" by bands of tissue.','Bend the body forward and steady the trunk.',EM,'Everyone has the "six-pack" blocks; most people just have a layer of fat over them.','The "six-pack" that bends the trunk forward');
E('quads','A group of four muscles on the front of the thigh.','Straighten the knee, which is vital for walking, running and jumping.',EM,'One of the biggest and strongest muscle groups in the body.','Straightens the knee');
E('calf','The bulging muscle at the back of the lower leg.','Lifts the heel and pushes the body forward when you walk.',EM,'It attaches to the heel by the Achilles tendon, the thickest and strongest tendon in the body.','Lifts the heel');
E('diaphragm','A broad, dome-shaped muscle between the chest and the abdomen.','When it contracts it flattens, the chest expands and air is drawn into the lungs. It is the main engine of breathing.',EM,'Hiccups are sudden, involuntary contractions of the diaphragm.','Dome-shaped muscle that powers breathing');
E('heart','A strong, fist-sized muscle with four chambers: two atria and two ventricles. It sits in the middle of the chest, tilted slightly to the left.','Pumps blood around the body without a break – about 100,000 beats a day.',EM,'The heart starts beating within the first weeks of pregnancy, long before birth.','A muscular pump that moves blood around the body');
E('arteries','Thick-walled tubes that carry oxygen-rich blood (bright red) away from the heart. The largest is the aorta.','Deliver oxygen and nutrients to every organ. The pulse you feel is an artery stretching with each heartbeat.',EM,'The aorta is about as wide as a garden hose.','Tubes that carry oxygen-rich blood from the heart');
E('veins','Thin-walled blood vessels with valves that carry oxygen-poor blood back to the heart (shown in blue).','Return blood to the heart; tiny valves stop it from flowing backwards.',EM,'All your blood vessels laid end to end are estimated to be about 100,000 km long – over twice around the Earth.','Carry oxygen-poor blood back to the heart');
E('lungs','Two soft, spongy organs. The right has three lobes and the left has two, to leave room for the heart.','Bring oxygen into the blood and remove carbon dioxide through hundreds of millions of tiny air sacs (alveoli).','Endoderm (lining) and mesoderm','The surface area of the alveoli is around 70 m² – like a small apartment.','Bring oxygen into the blood');
E('trachea','A flexible tube reinforced with C-shaped rings of cartilage.','Carries air from the throat to the lungs. Tiny hairs and mucus trap dust and germs.','Endoderm (lining) and mesoderm','The rings keep the windpipe from collapsing when you breathe in.','The windpipe that leads to the lungs');
E('esophagus','A muscular tube about 25 cm long from the throat to the stomach.','Pushes food downward in waves (peristalsis) – even if you stand on your head.','Endoderm (lining) and mesoderm','Because of these waves, you can swallow upside down.','Tube that carries food from the mouth to the stomach');
E('stomach','A muscular sack that can stretch to hold about a litre.','Churns food with acid and enzymes into a liquid paste.','Endoderm (lining) and mesoderm','The stomach lining renews itself every few days, or the acid would digest the stomach itself.','Churns food with acid');

E('smallint','A coiled tube several metres long (3 to 6 m).','Most digestion happens here, and most nutrients are absorbed into the blood through millions of tiny finger-like villi.','Endoderm (lining) and mesoderm','The villi increase the intestine\'s inner surface to around 30 m².','Where most nutrients are absorbed');
E('largeint','A wider, shorter tube (about 1.5 m) that frames the small intestine. It also includes the appendix.','Absorbs water and salts, and houses friendly bacteria that help digestion and make vitamins.','Endoderm (lining) and mesoderm','Trillions of bacteria – the "microbiome" – live in your body, mostly in the large intestine.','Absorbs water and hosts friendly bacteria');
E('brain','The control centre of the body: about 1.3 kg with roughly 86 billion nerve cells.','Thinks, remembers, feels, and manages breathing, heartbeat and movement.',EC+' – neural tube','The brain is about 2% of body weight but uses around 20% of its energy.','The control centre of the body');
E('cord','A thick bundle of nerves about 45 cm long, running inside the spine.','Carries messages between the brain and the body and runs quick reflexes.',EC+' – neural tube','In a reflex (like pulling your hand from heat), the reaction happens in the spinal cord before your brain "knows" what happened.','A highway for messages between brain and body');
E('nerves','Thin cables that branch out from the spinal cord to the whole body.','Send sensations (touch, heat, pain) to the brain and movement commands to the muscles.',EC,'Nerve signals travel at up to about 120 metres per second.','Cables that carry sensation and movement commands');
E('eyes','Two small balls (about 2.5 cm) with a lens and a retina.','Catch light and turn it into nerve signals that the brain reads as an image.',EC,'The image on the retina is upside down, and the brain flips it back.','Catch light so you can see');
E('kidneys','Two bean-shaped, fist-sized organs in the lower back.','Filter the blood (about 180 litres a day!), remove waste and extra water as urine, and regulate salts and blood pressure.',EM,'You can live a healthy life with just one kidney.','Filter blood and make urine');

E('bladder','A flexible, muscular sack that stretches as it fills.','Stores urine until you choose to empty it.','Endoderm (lining) and mesoderm','It holds about 400–600 ml, but you start feeling the urge at around 200 ml.','Stores urine');
E('thyroid','A butterfly-shaped gland in the neck, below the Adam\'s apple.','Releases hormones that set your metabolic rate – how fast the body uses energy.',EE,'It needs iodine, which is why some countries add iodine to table salt.','Butterfly-shaped gland that sets metabolism');
E('pancreas','A long organ behind the stomach. It is both a hormone gland and part of the digestive system.','Releases insulin (lowers blood sugar) and digestive enzymes into the intestine.',EE,'When the pancreas makes too little insulin, the result is type 1 diabetes.','Makes insulin');
E('adrenals','Two small glands that sit like caps on top of the kidneys.','Release adrenaline and cortisol – the "fight or flight" and stress hormones.','Mesoderm (outer part) and ectoderm (inner part)','Adrenaline can speed up your heart within seconds.','Release adrenaline');
E('spleen','A fist-sized organ on the left side of the abdomen, behind the stomach.','Filters old blood, activates immune cells and stores blood cells.',EM,'You can live without a spleen, but the risk of infections goes up.','Filters blood and supports immunity');
E('thymus','A small gland behind the breastbone, relatively large in children.','A "school" for T immune cells: this is where they learn to tell body cells from invaders.',EE,'After puberty the thymus shrinks and turns mostly to fat.','The school for T immune cells');
E('lymph','Small bean-shaped lumps in the neck, armpits and groin. There are about 600 in the body.','Filter lymph fluid and trap germs. They swell when you have an infection.',EM,'When your throat hurts and your neck "swells", those are lymph nodes at work.','Filter fluid and swell during infection');

/* ---- helpers ---- */
const V=(a)=>new T.Vector3(a[0],a[1],a[2]);
const SPH=new T.SphereGeometry(1,32,24);
function getMat(o,color,op,key){
  key=key||'main';
  if(!o.mats[key]){
    const m=new T.MeshStandardMaterial({color,roughness:.55,metalness:.04,transparent:op<1,opacity:op});
    o.mats[key]={m,base:new T.Color(color),op,cur:op};
  }
  return o.mats[key].m;
}
function add(id,geo,p,opt){
  opt=opt||{};const o=ORG[id];
  const mesh=new T.Mesh(geo,getMat(o,opt.color,opt.op==null?1:opt.op,opt.key));
  mesh.position.set(p[0],p[1],p[2]);
  if(opt.s)mesh.scale.set(opt.s[0],opt.s[1],opt.s[2]);
  if(opt.r)mesh.rotation.set(opt.r[0],opt.r[1],opt.r[2]);
  if(opt.q)mesh.quaternion.copy(opt.q);
  mesh.userData.organ=id;
  (opt.parent||SYS[o.sys].group).add(mesh);
  o.meshes.push(mesh);
  return mesh;
}
function ell(id,p,s,color,opt){return add(id,SPH,p,Object.assign({s,color},opt||{}));}
function tube(id,pts,r,color,opt){
  opt=opt||{};
  const curve=new T.CatmullRomCurve3(pts.map(V));
  const geo=new T.TubeGeometry(curve,opt.seg||64,r,opt.rad||10,false);
  add(id,geo,[0,0,0],Object.assign({color},opt));
  return curve;
}
function orient(a,b){
  const A=V(a),B=V(b),d=B.clone().sub(A);
  return {mid:A.clone().add(B).multiplyScalar(.5),len:d.length(),q:new T.Quaternion().setFromUnitVectors(new T.Vector3(0,1,0),d.clone().normalize())};
}
function bone(id,a,b,r0,r1,color,opt){
  const {mid,len,q}=orient(a,b);
  add(id,new T.CylinderGeometry(r1,r0,len,14),[mid.x,mid.y,mid.z],Object.assign({q,color},opt||{}));
  const k=1.5;
  add(id,SPH,a,Object.assign({s:[r0*k,r0*k,r0*k],color},opt||{}));
  add(id,SPH,b,Object.assign({s:[r1*k,r1*k,r1*k],color},opt||{}));
}
function muscleBetween(id,a,b,rad,color,flat){
  const {mid,len,q}=orient(a,b);
  add(id,SPH,[mid.x,mid.y,mid.z],{s:[rad,len*.55,rad*(flat||.8)],q,color,op:.78});
}

const raycaster=new T.Raycaster();
const mouse=new T.Vector2();
let selected=null,hovered=null,dimOn=true;
const sysVisible=id=>SYS[ORG[id].sys].visible;

function allPickables(){
  const arr=[];
  ORGANS.forEach(o=>{if(sysVisible(o.id)&&orgOK(o))arr.push(...o.meshes);});
  return arr;
}
function pickAt(cx,cy){
  const r=renderer.domElement.getBoundingClientRect();
  mouse.set(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1);
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(allPickables(),false);
  if(!hits.length)return null;
  for(const h of hits){if(!ORG[h.object.userData.organ].soft)return h.object.userData.organ;}
  return hits[0].object.userData.organ;
}

/* ===================== CAMERA ===================== */
const cam={yaw:0,pitch:.08,dist:34,target:new T.Vector3(0,.2,0),auto:false,tw:null};
const HOME={yaw:0,pitch:.08,dist:34,target:new T.Vector3(0,.2,0)};
function applyCam(){
  const cp=Math.cos(cam.pitch);
  camera.position.set(cam.target.x+cam.dist*Math.sin(cam.yaw)*cp,cam.target.y+cam.dist*Math.sin(cam.pitch),cam.target.z+cam.dist*Math.cos(cam.yaw)*cp);
  camera.lookAt(cam.target);
}
function tweenTo(to,dur){
  let dy=to.yaw!=null?to.yaw-cam.yaw:0;dy=Math.atan2(Math.sin(dy),Math.cos(dy));
  cam.tw={t:0,dur:dur||.9,from:{yaw:cam.yaw,pitch:cam.pitch,dist:cam.dist,target:cam.target.clone()},
    to:{yaw:cam.yaw+dy,pitch:to.pitch!=null?to.pitch:cam.pitch,dist:to.dist!=null?to.dist:cam.dist,target:to.target?to.target.clone():cam.target.clone()}};
}
function focusOrgan(id){
  const box=new T.Box3();
  ORG[id].meshes.forEach(m=>box.expandByObject(m));
  const c=box.getCenter(new T.Vector3()),sz=box.getSize(new T.Vector3());
  const m=Math.max(sz.x,sz.y,sz.z);
  tweenTo({target:c,dist:Math.min(34,Math.max(9,m*1.6+8)),pitch:.12,yaw:0},.9);
}
function resetCam(){tweenTo(HOME,.9);}

(function controls(){
  const el=renderer.domElement;const ptrs=new Map();let moved=0,start=null,pinch=0,lastMid=null;
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;start={x:e.clientX,y:e.clientY};cam.tw=null;
    if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);lastMid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};}});
  el.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId);
    if(!p){onHover(e);return;}
    const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
    if(ptrs.size===2){
      const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinch)cam.dist=Math.max(5,Math.min(48,cam.dist*pinch/d));pinch=d;
      const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      if(lastMid){const k=cam.dist*.0016;cam.target.y+=(my-lastMid.y)*k;cam.target.x-=(mx-lastMid.x)*k*Math.cos(cam.yaw);cam.target.z+=(mx-lastMid.x)*k*Math.sin(cam.yaw);cam.target.y=Math.max(-9,Math.min(9,cam.target.y));}
      lastMid={x:mx,y:my};
    }else if(e.shiftKey||e.buttons===2){
      const k=cam.dist*.0016;
      cam.target.y+=dy*k;
      cam.target.x-=dx*k*Math.cos(cam.yaw);cam.target.z+=dx*k*Math.sin(cam.yaw);
      cam.target.y=Math.max(-9,Math.min(9,cam.target.y));
    }else{
      cam.yaw-=dx*.0065;cam.pitch=Math.max(-1.2,Math.min(1.2,cam.pitch+dy*.005));
    }
  });
  const up=e=>{
    ptrs.delete(e.pointerId);pinch=0;lastMid=null;
    if(moved<6&&start&&e.type==='pointerup'){onClickScene(pickAt(e.clientX,e.clientY));}
  };
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{e.preventDefault();cam.tw=null;cam.dist=Math.max(5,Math.min(48,cam.dist*Math.exp(e.deltaY*.0012)));},{passive:false});
  el.addEventListener('pointerleave',()=>{setHover(null);});
})();

/* ===================== ANIMATION ===================== */
let bpm=72,brpm=14,tgtBpm=72,tgtBr=14,beatPh=0,breathPh=0,clock=new T.Clock();
function frame(){
  const dt=Math.min(clock.getDelta(),.05),time=clock.elapsedTime;
  // camera
  if(cam.tw){
    const w=cam.tw;w.t+=dt/w.dur;const k=Math.min(1,w.t),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    cam.yaw=w.from.yaw+(w.to.yaw-w.from.yaw)*e;cam.pitch=w.from.pitch+(w.to.pitch-w.from.pitch)*e;cam.dist=w.from.dist+(w.to.dist-w.from.dist)*e;
    cam.target.copy(w.from.target).lerp(w.to.target,e);if(k>=1)cam.tw=null;
  }else if(cam.auto){cam.yaw+=dt*.35;}
  applyCam();
  // vitals
  bpm+=(tgtBpm-bpm)*Math.min(1,dt*1.2);brpm+=(tgtBr-brpm)*Math.min(1,dt*1.2);
  beatPh=(beatPh+dt*bpm/60)%1;breathPh=(breathPh+dt*brpm/60)%1;
  const lub=Math.exp(-Math.pow((beatPh-.05)/.045,2)),dub=.6*Math.exp(-Math.pow((beatPh-.3)/.055,2));
  heartGroup.scale.setScalar(1+.11*(lub+dub));
  const br=.5-.5*Math.cos(breathPh*Math.PI*2);const amp=.04+.03*Math.min(1,brpm/38);
  lungMeshes.forEach(m=>m.scale.set(m.userData.bs.x*(1+amp*br),m.userData.bs.y*(1+amp*1.4*br),m.userData.bs.z*(1+amp*br)));
  flows.forEach((f,fi)=>{const sp=.14*bpm/72;f.items.forEach((m,i)=>{const t=(((time*sp)+i/f.n)%1+1)%1;m.position.copy(f.curve.getPoint(t));});});
  // materials: dim & highlight
  const pulse=.5+.5*Math.sin(time*4);
  ORGANS.forEach(o=>{
    let target=1;
    if(dimOn&&(selected||hiSet.size)&&o.id!==selected&&!hiSet.has(o.id))target=.16;
    o.cur+=(target-o.cur)*Math.min(1,dt*7);
    const glow=o.id===selected?.28+.22*pulse:(o.id===hovered?.28:0);
    for(const k in o.mats){const e=o.mats[k];
      e.m.opacity=e.op*o.cur;
      e.m.transparent=e.m.opacity<.995;e.m.depthWrite=e.m.opacity>.6;
      if(k==='main'||k==='iris'){if(hiSet.has(o.id))e.m.emissive.copy(hiRed).multiplyScalar(.35+.35*pulse);else e.m.emissive.copy(e.base).multiplyScalar(glow);}}
  });
  if(typeof journeyTick==='function')journeyTick(dt,time);
  if(typeof viewTick==='function')viewTick(dt);
  updateTag();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

  camera.fov=w/h<.75?60:38;const nd=w/h<.75?27:34;if(cam.dist===HOME.dist)cam.dist=nd;HOME.dist=nd;view.last='';camera.updateProjectionMatrix();}

function setHover(id,ev){

  if(id&&!hide){tip.style.display='block';tip.textContent=nm(ORG[id]);if(ev){tip.style.left=ev.clientX+'px';tip.style.top=ev.clientY+'px';}}

  if(!selected||hide){tag.style.display='none';return;}
  const box=new T.Box3();ORG[selected].meshes.forEach(m=>box.expandByObject(m));
  box.getCenter(_v);_v.y=box.max.y;_v.project(camera);

/* ===================== QUIZ ===================== */
const qEl=$('p-quiz');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function startQuiz(){
  if(journey.active)stopJourney();
  if(cond.active)stopCond();
  quiz.active=true;quiz.finished=false;quiz.i=0;quiz.score=0;quiz.right=0;quiz.streak=0;
  document.body.classList.add('quizOn');
  SYS_ORDER.forEach(k=>showSystem(k,k!=='muscular'&&k!=='reproductive'));
  selected=null;showWelcome();resetCam();
  quiz.order=shuffle(ORGANS.filter(orgOK).map(o=>o.id));
  nextQ();
}
function endQuiz(){
  quiz.active=false;quiz.finished=false;quiz.cur=null;document.body.classList.remove('quizOn');renderQuiz();
}
function pickType(){
  const w=level===1?{find:.4,func:.35,sys:.25}:level===2?{find:.25,func:.15,sys:.15,origin:.2,role:.25}:{find:.15,func:.15,sys:.1,origin:.25,role:.35};
  const r=Math.random();let acc=0;for(const k in w){acc+=w[k];if(r<acc)return k;}return 'func';
}
function qCorrect(c){const o=ORG[c.id];return c.type==='sys'?o.sys:c.type==='origin'?LAYER[c.id]:c.id;}
function qLabel(c,x){
  if(c.type==='sys')return sysName(x);
  if(c.type==='origin')return t('layer_'+x);
  if(c.type==='role')return fld(ORG[x],'fn');
  return nm(ORG[x]);
}
function nextQ(){
  if(quiz.i>=quiz.n)return showResult();
  const id=quiz.order[quiz.i];const o=ORG[id];
  selected=null;showWelcome();
  let type=pickType();
  if(type==='find'&&!sysVisible(id))type='func';
  if(type==='sys'&&o.amb)type='func';
  if(type==='origin'&&!LAYER[id])type='role';
  quiz.cur={type,id};quiz.done=false;quiz.wrong=0;quiz.fb=null;
  if(type==='find')resetCam();
  const nd=level===3?4:3;
  if(type==='func'||type==='role'){
    const pool=ORGANS.filter(x=>orgOK(x)&&x.id!==id&&x.he!==o.he);
    const same=shuffle(pool.filter(x=>x.sys===o.sys)),other=shuffle(pool.filter(x=>x.sys!==o.sys));
    const d=(level>=2?same.concat(other):shuffle(pool)).slice(0,nd);
    quiz.cur.opts=shuffle([o.id].concat(d.map(x=>x.id)));
  }
  if(type==='sys'){const d=shuffle(SYS_ORDER.filter(k=>k!==o.sys&&k!=='skin')).slice(0,3);quiz.cur.opts=shuffle([o.sys].concat(d));}
  if(type==='origin')quiz.cur.opts=['ecto','meso','endo'];
  renderQuiz();
}
function levelSeg(){return '<div class="sec">'+t('lvlT')+'</div><div class="seg2">'+[1,2,3].map(n=>'<button data-lvl="'+n+'" class="'+(level===n?'on':'')+'">'+t('lvl'+n)+'</button>').join('')+'</div>';}
function renderQuiz(){
  if(!quiz.active){
    qEl.innerHTML='<h3 class="h1">'+t('qIntroT')+'</h3><p class="sub">'+t('qIntroP')+'</p>'+levelSeg()+'<button class="btn pri" id="qStart" style="width:100%;padding:13px;margin-top:16px">'+t('qStart')+'</button>'+(quiz.best?'<p class="sub" style="margin-top:12px">'+t('best')+': '+quiz.best+'</p>':'');
    return;
  }
  if(!quiz.cur){return;}
  const c=quiz.cur,o=ORG[c.id];
  let q='',opts='';
  if(c.type==='find'){q=t('qFind',nm(o));opts='<p class="sub">'+t('qFindHint')+'</p>';}
  else if(c.type==='func'){q=t('qClue',fld(o,'hint'));}
  else if(c.type==='sys'){q=t('qWhichSys',nm(o));}
  else if(c.type==='role'){q=t('qRole',nm(o));}
  else{q=t('qOrigin',nm(o));}
  if(c.opts){
    const correct=qCorrect(c);
    opts='<div class="opts">'+c.opts.map(x=>{
      let cls='';if(quiz.done){if(x===correct)cls='good';else if(x===c.picked)cls='bad';}
      return '<button class="'+cls+'" data-ans="'+x+'" '+(quiz.done?'disabled':'')+'>'+qLabel(c,x)+'</button>';}).join('')+'</div>';
  }
  const fb=quiz.fb?'<div class="fb '+(quiz.fb.ok?'good':'bad')+'">'+quiz.fb.html+'</div>':'<div class="fb"></div>';
  let act='';
  if(quiz.done)act='<button class="btn pri" id="qNext" style="width:100%">'+(quiz.i+1>=quiz.n?t('toRes'):t('next'))+'</button>';
  else if(c.type==='find')act='<button class="btn" id="qSkip">'+t('skip')+'</button>';
  qEl.innerHTML='<div class="qh"><span>'+t('qOf',quiz.i+1,quiz.n)+'</span><span>'+t('qScore')+': <b>'+quiz.score+'</b>'+(quiz.streak>1?' · '+t('qStreak')+' '+quiz.streak:'')+'</span></div>'+
    '<div class="bar"><i style="width:'+(quiz.i/quiz.n*100)+'%"></i></div><div class="qt">'+q+'</div>'+opts+fb+'<div class="row">'+act+'</div>'+
    '<div class="row"><button class="btn" id="qClose" style="font-size:13px">'+t('qEnd')+'</button></div>';
}
qEl.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='qStart')startQuiz();
  if(b.dataset.ans&&!quiz.done)answerMC(b.dataset.ans);
  if(b.id==='qNext'){quiz.i++;nextQ();}
  if(b.id==='qSkip')revealFind(true);
  if(b.id==='qAgain')startQuiz();
  if(b.id==='qClose')endQuiz();
});
function award(base){const bonus=Math.min(quiz.streak,5);quiz.score+=base+bonus;quiz.streak++;quiz.right++;return base+bonus;}
function setFb(ok,key,...a){quiz.fb={ok,key,a};quiz.fb.html=t(key,...a);quiz.done=true;}
function answerMC(ans){
  const c=quiz.cur,o=ORG[c.id];const correct=qCorrect(c);c.picked=ans;
  if(ans===correct){setFb(true,'right',award(10+(level-1)*2));}
  else{quiz.streak=0;setFb(false,'wrongAns',qLabel(c,correct));}
  selectOrgan(c.id);renderQuiz();
}
function answerFind(id){
  const c=quiz.cur,o=ORG[c.id];
  if(id===c.id){setFb(true,'right',award([10,6,3,0][Math.min(quiz.wrong,3)]));selectOrgan(c.id);renderQuiz();return;}
  quiz.wrong++;quiz.streak=0;
  if(quiz.wrong>=3){revealFind(false);return;}
  quiz.fb={ok:false,key:'thatsX',a:[nm(ORG[id]),quiz.wrong>=2?sysName(o.sys):''],html:''};
  quiz.fb.html=t('thatsX',...quiz.fb.a);
  renderQuiz();
}
function revealFind(skipped){
  const o=ORG[quiz.cur.id];quiz.streak=0;setFb(false,'revealed',skipped,nm(o));
  selectOrgan(o.id);renderQuiz();
}
function showResult(){
  quiz.cur=null;quiz.best=Math.max(quiz.best,quiz.score);quiz.finished=true;
  selected=null;showWelcome();resetCam();document.body.classList.remove('quizOn');
  renderResult();
}
function renderResult(){
  const pct=quiz.right/quiz.n;const msg=pct>=.8?t('m1'):pct>=.5?t('m2'):t('m3');
  qEl.innerHTML='<div class="qh"><span>'+t('done')+'</span><span>'+t('best')+': '+quiz.best+'</span></div><div class="big">'+quiz.score+'</div><p class="sub" style="margin-top:6px">'+t('pts')+' · '+t('correctOf',quiz.right,quiz.n)+'</p><p>'+msg+'</p><div class="row"><button class="btn pri" id="qAgain">'+t('again')+'</button><button class="btn" id="qClose">'+t('close')+'</button></div>';
}

const journey={active:false,id:null,i:0,done:false};
const jPane=$('p-journey');
let marker=null;const mTarget=new T.Vector3();
function ensureMarker(){
  if(marker)return;
  const g=new T.Group();
  const core=new T.Mesh(new T.SphereGeometry(.2,20,16),new T.MeshBasicMaterial({color:0xff9f1c,depthTest:false,transparent:true,opacity:.95}));
  const halo=new T.Mesh(new T.SphereGeometry(.4,20,16),new T.MeshBasicMaterial({color:0xff9f1c,depthTest:false,transparent:true,opacity:.28}));
  core.renderOrder=30;halo.renderOrder=29;g.add(core,halo);g.userData={core,halo};scene.add(g);marker=g;
}
function journeyTick(dt,time){
  if(!marker)return;
  marker.visible=journey.active&&!journey.done;
  if(!marker.visible)return;
  marker.position.lerp(mTarget,1-Math.exp(-dt*2.6));
  marker.scale.setScalar(1+.18*Math.sin(time*6));
}
function setStep(i){
  const j=JOURNEYS[journey.id],s=j.steps[i];journey.i=i;
  selectOrgan(s.o);
  const box=new T.Box3();ORG[s.o].meshes.forEach(m=>box.expandByObject(m));box.getCenter(mTarget);
  if(i===0)marker.position.copy(mTarget);
  renderJourney();runStep('journey');
}
function startJourney(k){
  if(quiz.active)endQuiz();
  if(cond.active)stopCond();
  ensureMarker();const j=JOURNEYS[k];
  marker.userData.core.material.color.setHex(j.color);marker.userData.halo.material.color.setHex(j.color);
  journey.active=true;journey.id=k;journey.done=false;
  setStep(0);
}
function stopJourney(){
  journey.active=false;journey.done=false;selected=null;showWelcome();resetCam();renderJourney();
}
function renderJourney(){
  if(!journey.active){
    jPane.innerHTML='<h3 class="h1">'+t('jTitle')+'</h3><p class="sub">'+t('jSub')+'</p>'+autoOpt()+Object.keys(JOURNEYS).map(k=>{const j=JOURNEYS[k];
      return '<button class="jcard" data-jstart="'+k+'"><b style="display:flex;align-items:center;gap:8px"><i style="width:12px;height:12px;border-radius:50%;background:'+j.css+'"></i>'+j[lang].title+'</b><span class="sub" style="display:block;margin:6px 0 0">'+j[lang].desc+'</span></button>';}).join('');
    return;
  }
  const j=JOURNEYS[journey.id],n=j.steps.length;
  if(journey.done){
    jPane.innerHTML='<h3 class="h1">'+t('jDone')+'</h3><div class="bar"><i style="width:100%;background:'+j.css+'"></i></div><p>'+t('jDoneP')+'</p><div class="row"><button class="btn pri" data-jstart="'+journey.id+'">'+t('jAgain')+'</button><button class="btn" data-jstop="1">'+t('jOther')+'</button></div>';
    return;
  }
  const s=j.steps[journey.i],o=ORG[s.o];
  jPane.innerHTML='<div class="qh"><span>'+j[lang].title+'</span><span>'+t('jStep',journey.i+1,n)+'</span></div><div class="bar"><i style="width:'+((journey.i+1)/n*100)+'%;background:'+j.css+'"></i></div>'+
    '<h3 class="h1">'+spk('journey')+nm(o)+'</h3><p style="line-height:1.7;margin:8px 0 16px">'+s[lang]+'</p>'+
    autoOpt()+'<div class="row"><button class="btn" data-jprev="1"'+(journey.i===0?' disabled style="opacity:.4"':'')+'>'+t('jPrev')+'</button><button class="btn pri" data-jnext="1">'+(journey.i+1>=n?t('jFinish'):t('jNext'))+'</button></div>'+
    '<div class="row"><button class="btn" data-jstop="1" style="font-size:13px">'+t('jStop')+'</button></div>';
}
jPane.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.jstart)startJourney(b.dataset.jstart);
  if(b.dataset.jprev)setStep(Math.max(0,journey.i-1));
  if(b.dataset.jnext){
    const n=JOURNEYS[journey.id].steps.length;
    if(journey.i+1>=n){journey.done=true;selected=null;showWelcome();resetCam();renderJourney();}else setStep(journey.i+1);
  }
  if(b.dataset.jstop)stopJourney();
});

   prev:[`Do not smoke`,`Keep blood pressure, cholesterol and sugar in a healthy range`,`Exercise regularly and eat a balanced diet`]},
  steps:[
   {o:['arteries'],v:[72,14],he:`במשך שנים נוצרות בדפנות עורקי הכלילית משקעים של שומן וכולסטרול (פלאק). העורק הולך ומצטמצם.`,en:`Over the years, fatty deposits and cholesterol (plaque) build up in the walls of the coronary arteries. The artery slowly narrows.`},
   {o:['arteries','heart'],v:[95,18],he:`הפלאק נסדק, ובמקום נוצרת קריש דם. הקריש חוסם את העורק ומנתק אספקת דם לחלק משריר הלב.`,en:`The plaque cracks and a blood clot forms on it. The clot blocks the artery and cuts off the blood supply to part of the heart muscle.`},
   {o:['heart'],v:[110,24],he:`שריר שלא מקבל חמצן מתחיל להיפגע בתוך דקות. מרגישים לחץ בחזה, והלב עלול לפעום בקצב לא תקין.`,en:`Muscle that gets no oxygen begins to be damaged within minutes. You feel pressure in the chest, and the heart may beat abnormally.`},
   {o:['heart','arteries'],v:[85,16],he:`הטיפול: לפתוח את העורק מהר, בצנתור עם תומכן (סטנט) או בתרופות שממיסות את הקריש. "זמן הוא שריר לב" – ככל שמהר יותר, כך נשמר יותר שריר.`,en:`Treatment: reopen the artery quickly, with a catheter and stent or clot-dissolving drugs. "Time is muscle" – the faster, the more heart muscle is saved.`}
  ]},
 {id:'cardiacarrest',color:'#b5179e',
  he:{title:`דום לב`,short:`הלב מפסיק לשאוב דם ביעילות, בדרך כלל בגלל תקלה חשמלית. זה לא אותו דבר כמו התקף לב.`,
   signs:[`התמוטטות פתאומית`,`אין תגובה כשקוראים או מנערים בעדינות`,`אין נשימה, או נשימה חריגה של התנשמות`],
   act:[`הזעיקו עזרה רפואית מיד (בישראל: 101) וביקשו דפיברילטור`,`התחילו עיסויי חזה מיד: ידיים במרכז החזה, עמוק ומהר, כ־100–120 לחיצות בדקה`,`הפעילו דפיברילטור (AED) כשהוא מגיע ופעלו לפי ההוראות הקוליות`,`המשיכו עד שמגיעים אנשי הצוות`],
   prev:[`בדיקת לב במשפחות עם מקרים של מוות פתאומי או מחלות לב`,`טיפול במחלות לב קיימות`,`לימוד החייאה: זו מיומנות שמצילה חיים`]},
  en:{title:`Cardiac arrest`,short:`The heart stops pumping blood effectively, usually because of an electrical fault. It is not the same as a heart attack.`,
   signs:[`Sudden collapse`,`No response when you call out or gently shake the person`,`No breathing, or only abnormal gasping`],
   act:[`Call emergency services immediately (101 in Israel) and ask for a defibrillator`,`Start chest compressions at once: hands in the centre of the chest, push hard and fast, about 100–120 per minute`,`Use an AED as soon as it arrives and follow its voice instructions`,`Continue until professional help arrives`],
   prev:[`Heart checks in families with sudden death or heart disease`,`Treat existing heart conditions`,`Learn CPR – a skill that saves lives`]},
  steps:[
   {o:['heart'],v:[190,20],he:`תקלה חשמלית (לרוב "פרפור חדרים"): החדרים רועדים במקום להתכווץ, והלב כבר לא שואב דם.`,en:`An electrical fault (often "ventricular fibrillation"): the ventricles quiver instead of contracting, and the heart no longer pumps blood.`},
   {o:['heart','arteries','brain'],v:[0,0],he:`הדם מפסיק לזרום. תוך שניות האדם מאבד הכרה ואינו נושם כרגיל.`,en:`Blood stops flowing. Within seconds the person loses consciousness and stops breathing normally.`},
   {o:['brain'],v:[0,0],he:`המוח רגיש במיוחד: בלי חמצן הוא מתחיל להיפגע בתוך כמה דקות. לכן כל דקה קובעת.`,en:`The brain is especially sensitive: without oxygen it starts to be damaged within minutes. Every minute counts.`},
   {o:['heart','sternum'],v:[110,0],he:`עיסויי חזה דוחפים דם באופן ידני אל המוח והלב, ומרוויחים זמן עד שהלב יחזור לפעול.`,en:`Chest compressions push blood manually to the brain and heart, buying time until the heart can work again.`},
   {o:['heart'],v:[75,14],he:`דפיברילטור שולח שוק חשמלי שמאפס את הפעילות החשמלית, ואם מצליח, הלב חוזר לקצב תקין.`,en:`A defibrillator sends an electric shock that resets the heart's electrical activity, and if it works the heart returns to a normal rhythm.`}
  ]},
 {id:'stroke',color:'#7b2cbf',
  he:{title:`שבץ מוחי`,short:`אספקת הדם לחלק מהמוח נפסקת, בדרך כלל בגלל קריש, ותאי עצב מתחילים למות.`,
   signs:[`פנים: צד אחד של הפנים צונח כשמנסים לחייך`,`יד: חולשה או נימול בזרוע או ברגל, בדרך כלל בצד אחד`,`דיבור: דיבור מבולבל או לא ברור, או קושי להבין`,`זמן: מתקשרים מיד! וגם: איבוד ראייה פתאומי, סחרחורת חזקה או כאב ראש חריג ופתאומי`],
   act:[`הזעיקו עזרה רפואית מיד, גם אם התסמינים חולפים`,`רשמו מתי התחילו התסמינים – זה קובע איזה טיפול אפשרי`,`אל תתנו אוכל, שתייה או תרופות`,`הישארו עם האדם והרגיעו אותו`],
   prev:[`איזון לחץ דם גבוה, הגורם החשוב ביותר`,`הפסקת עישון`,`טיפול בהפרעות קצב (פרפור פרוזדורים) ובסוכרת`,`פעילות גופנית ותזונה בריאה`]},
  en:{title:`Stroke`,short:`Blood supply to part of the brain stops, usually because of a clot, and nerve cells start to die.`,
   signs:[`Face: one side of the face droops when trying to smile`,`Arm: weakness or numbness in an arm or leg, usually on one side`,`Speech: slurred or confused speech, or trouble understanding`,`Time: call at once! Also sudden loss of vision, severe dizziness or an unusual sudden headache`],
   act:[`Call emergency services immediately, even if symptoms pass`,`Note when the symptoms started – it decides which treatment is possible`,`Do not give food, drink or medicine`,`Stay with the person and keep them calm`],
   prev:[`Control high blood pressure, the most important factor`,`Stop smoking`,`Treat rhythm problems (atrial fibrillation) and diabetes`,`Exercise and eat healthily`]},
  steps:[
   {o:['arteries'],v:[85,16],he:`בדרך כלל קריש דם חוסם עורק שמוביל דם למוח (שבץ איסכמי). לעיתים, במקום זאת, כלי דם במוח נקרע ומדמם.`,en:`Usually a blood clot blocks an artery that carries blood to the brain (ischemic stroke). Sometimes a blood vessel in the brain bursts and bleeds instead.`},
   {o:['brain'],v:[90,16],he:`האזור שלא מקבל דם נחנק מחוסר חמצן. לפי הערכות, מאות אלפי תאי עצב נפגעים בכל דקה. "זמן הוא מוח".`,en:`The area without blood is starved of oxygen. By some estimates, hundreds of thousands of nerve cells are damaged every minute. "Time is brain".`},
   {o:['brain','nerves'],v:[90,16],he:`התסמינים תלויים באזור שנפגע: צד אחד של הפנים צונח, יד נחלשת או הדיבור משתבש. כל חצי מוח שולט בצד הנגדי של הגוף.`,en:`Symptoms depend on the area hit: one side of the face droops, an arm weakens or speech is disturbed. Each half of the brain controls the opposite side of the body.`},
   {o:['brain','arteries'],v:[75,14],he:`הטיפול: תרופה שממיסה את הקריש או הוצאה של הקריש בצנתור, בתוך שעות ספורות מתחילת התסמינים, ואחר כך שיקום.`,en:`Treatment: a clot-dissolving drug or removing the clot with a catheter, within a few hours of the start of symptoms, followed by rehabilitation.`}
  ]},
 {id:'flu',color:'#2a9d8f',

  en:{title:`Influenza (flu)`,short:`A viral infection of the airways that spreads easily from person to person.`,
   signs:[`High fever that starts suddenly, chills`,`Muscle and head aches, strong tiredness`,`Dry cough and sore throat`],
   act:[`Rest and drink plenty of fluids`,`Medicines to lower fever and pain, as directed`,`Stay home so you don't infect others`,`See a doctor if there is shortness of breath, chest pain, confusion or prolonged fever, or if the person is high-risk (babies, older adults, pregnant women, chronic illness)`],
   prev:[`Annual vaccine`,`Frequent hand washing`,`Cover your nose and mouth when coughing or sneezing`]},
  steps:[
   {o:['nose','pharynx'],v:[72,14],he:`הנגיף נכנס דרך האף או הפה ונצמד לתאים שמרפדים את דרכי הנשימה.`,en:`The virus enters through the nose or mouth and attaches to the cells lining the airways.`},
   {o:['trachea','lungs'],v:[85,18],he:`הנגיף מתרבה בתאים ופוגע ברירית. מופיעים שיעול וכאב גרון, ויש הדבקה של אחרים בשיעול ובעטישה.`,en:`The virus multiplies inside the cells and damages the lining. Cough and sore throat appear, and you can infect others when coughing and sneezing.`},
   {o:['lymph','spleen','thymus'],v:[95,20],he:`מערכת החיסון מזהה את הנגיף ומפעילה תאי הגנה ואותות כימיים. האותות האלה הם שגורמים לעייפות, כאבי שרירים ותחושת חולי.`,en:`The immune system recognises the virus and activates defence cells and chemical signals. These signals cause tiredness, muscle aches and the feeling of being ill.`},
   {o:['brain'],v:[105,22],he:`האותות מגיעים למוח, שמעלה את "התרמוסטט" של הגוף. החום עוזר להילחם בנגיף, ולכן מרגישים צמרמורת.`,en:`The signals reach the brain, which raises the body's "thermostat". Fever helps fight the virus, which is why you feel chills.`},
   {o:['lungs'],v:[75,15],he:`רוב האנשים מבריאים בתוך שבוע בערך. אצל חלק, בעיקר בקבוצות סיכון, השפעת עלולה להסתבך בדלקת ריאות.`,en:`Most people recover within about a week. In some, mainly high-risk groups, flu can lead to pneumonia.`}
  ]},
 {id:'asthma',color:'#4895ef',
  he:{title:`התקף אסתמה`,short:`דרכי האוויר בריאות מצטמצמות פתאום, וקשה לנשוף אוויר החוצה.`,

   act:[`לשבת זקוף ולהישאר רגועים`,`להשתמש במשאף ההקלה לפי תוכנית הטיפול`,`להזעיק עזרה אם אין שיפור אחרי דקות ספורות, אם קשה לדבר או אם השפתיים כחלחלות`],
   prev:[`הימנעות ממפעילים (אבק, עשן, אלרגנים)`,`שימוש קבוע בתרופות המניעה`,`תוכנית טיפול כתובה עם הרופא`]},
  en:{title:`Asthma attack`,short:`The airways in the lungs suddenly narrow, making it hard to breathe air out.`,

   act:[`Sit upright and stay calm`,`Use the reliever inhaler as in your treatment plan`,`Call for help if there is no improvement after a few minutes, if talking is hard or the lips turn bluish`],

  steps:[
   {o:['lungs','trachea'],v:[90,20],he:`מפעיל (אלרגן, אוויר קר, מאמץ או זיהום) מגרה את דרכי האוויר.`,en:`A trigger (allergen, cold air, exertion or infection) irritates the airways.`},
   {o:['lungs'],v:[110,30],he:`דפנות הסימפונות מתנפחות, השריר סביבן מתכווץ והריר מצטבר. דרכי האוויר נעשות צרות.`,en:`The walls of the bronchi swell, the muscle around them tightens and mucus builds up. The airways become narrow.`},
   {o:['diaphragm','lungs'],v:[125,38],he:`האוויר נתקע בריאות וקשה לנשוף. השרירים מתאמצים, נשמעים צפצופים, והחזה מרגיש לחוץ.`,en:`Air gets trapped in the lungs and it is hard to breathe out. Muscles work hard, you hear wheezing, and the chest feels tight.`},
   {o:['lungs'],v:[90,20],he:`משאף הקלה משחרר את השריר סביב הסימפונות, ודרכי האוויר נפתחות בתוך דקות.`,en:`A reliever inhaler relaxes the muscle around the bronchi, and the airways open within minutes.`}
  ]},
 {id:'diabetes',color:'#f4a261',
  he:{title:`סוכרת`,short:`הגוף לא מצליח להכניס סוכר מהדם אל התאים, ולכן רמת הסוכר בדם נשארת גבוהה.`,
   signs:[`צמא רב ושתן תכוף`,`עייפות ורעב`,`ירידה במשקל (בסוג 1), ראייה מטושטשת, פצעים שמחלימים לאט`],
   act:[`בדיקת דם לסוכר אצל הרופא`,`ניטור סוכר, תרופות או אינסולין לפי הצורך`,`תזונה מאוזנת ופעילות גופנית`,`מצב חירום: הקאות, בלבול, נשימה מהירה או ריח פירותי בנשימה – לפנות מיד לעזרה רפואית`],
   prev:[`סוכרת סוג 2: שמירה על משקל תקין, תנועה ותזונה מאוזנת`,`סוכרת סוג 1 אינה ניתנת למניעה`]},
  en:{title:`Diabetes`,short:`The body cannot move sugar from the blood into the cells, so blood sugar stays high.`,
   signs:[`Strong thirst and frequent urination`,`Tiredness and hunger`,`Weight loss (type 1), blurred vision, slow-healing wounds`],
   act:[`A blood sugar test at the doctor`,`Monitor sugar, take medicine or insulin as needed`,`Balanced diet and physical activity`,`Emergency: vomiting, confusion, fast breathing or a fruity smell on the breath – get medical help at once`],
   prev:[`Type 2: keep a healthy weight, stay active and eat a balanced diet`,`Type 1 cannot be prevented`]},
  steps:[
   {o:['pancreas'],v:[72,14],he:`הלבלב מייצר אינסולין, ההורמון שמאפשר לסוכר להיכנס לתאים. בסוג 1 מערכת החיסון הורסת את התאים המייצרים אותו; בסוג 2 התאים מגיבים לאינסולין חלש.`,en:`The pancreas makes insulin, the hormone that lets sugar into cells. In type 1 the immune system destroys the cells that make it; in type 2 the cells respond poorly to insulin.`},
   {o:['arteries','veins','liver'],v:[75,14],he:`הסוכר נשאר בדם ורמתו עולה. הכבד אפילו משחרר עוד סוכר, וכך המצב מחמיר.`,en:`Sugar stays in the blood and its level rises. The liver even releases more sugar, making things worse.`},
   {o:['kidneys','bladder'],v:[78,15],he:`הכליות מנסות להיפטר מהעודף בשתן, ומושכות איתו הרבה מים. התוצאה: צמא ושתן תכוף.`,en:`The kidneys try to get rid of the excess in urine, pulling lots of water with it. The result: thirst and frequent urination.`},
   {o:['eyes','nerves','kidneys','arteries'],v:[78,15],he:`אם הסוכר נשאר גבוה שנים, הוא פוגע בכלי דם קטנים ובעצבים – בעיניים, בכליות, ברגליים ובלב.`,en:`If sugar stays high for years, it damages small blood vessels and nerves – in the eyes, kidneys, feet and heart.`},
   {o:['pancreas','liver'],v:[72,14],he:`אפשר לחיות היטב עם סוכרת: ניטור, תרופות או אינסולין, תזונה ותנועה שומרים על הסוכר בטווח תקין.`,en:`You can live well with diabetes: monitoring, medicine or insulin, diet and exercise keep sugar in a healthy range.`}
  ]},
 {id:'kidneystone',color:'#2ec4b6',
  he:{title:`אבן בכליה`,short:`גבישים של מינרלים בשתן מתאחדים לאבן שעלולה לחסום את דרכי השתן.`,
   signs:[`כאב עז בצד הגב או הבטן שבא בגלים ויכול להקרין למפשעה`,`דם בשתן`,`בחילה והקאות`],
   act:[`לפנות לרופא לבדיקה`,`שתייה מרובה ותרופות לכאב לפי הנחיית הרופא`,`לפנות מיד לחדר מיון אם יש חום, חוסר יכולת להשתין או כאב בלתי נשלט`],
   prev:[`לשתות הרבה מים`,`להפחית מלח`,`להתייעץ על תזונה אם הייתה אבן בעבר`]},
  en:{title:`Kidney stone`,short:`Mineral crystals in the urine clump into a stone that can block the urinary tract.`,
   signs:[`Severe pain in the side of the back or abdomen that comes in waves and can spread to the groin`,`Blood in the urine`,`Nausea and vomiting`],
   act:[`See a doctor for assessment`,`Drink plenty of fluids and take pain medicine as the doctor directs`,`Go to the emergency room if there is fever, inability to urinate or uncontrolled pain`],
   prev:[`Drink plenty of water`,`Cut down on salt`,`Get diet advice if you have had a stone before`]},
  steps:[
   {o:['kidneys'],v:[72,14],he:`כשהשתן מרוכז, מינרלים כמו סידן נקשרים לגבישים ויוצרים אבן קטנה בתוך הכליה.`,en:`When urine is concentrated, minerals such as calcium bind into crystals and form a small stone inside the kidney.`},
   {o:['ureters'],v:[95,18],he:`האבן נכנסת לשופכן, צינור צר. היא חוסמת את זרימת השתן, הכליה מתנפחת, והכאב החזק מגיע בגלים.`,en:`The stone enters the ureter, a narrow tube. It blocks the flow of urine, the kidney swells and the strong pain comes in waves.`},
   {o:['bladder'],v:[85,16],he:`האבן מגיעה לשלפוחית ויוצאת עם השתן. רוב האבנים הקטנות עוברות לבד תוך ימים עד שבועות.`,en:`The stone reaches the bladder and leaves with the urine. Most small stones pass on their own within days to weeks.`},
   {o:['kidneys','ureters'],v:[72,14],he:`אבנים גדולות לא יוצאות לבד. אפשר לנפץ אותן בגלי הלם או להוציא אותן במכשיר דק.`,en:`Large stones do not pass by themselves. They can be broken up with shock waves or removed with a thin instrument.`}
  ]},
 {id:'fracture',color:'#e9c46a',

function condStep(i){

const SS=(typeof window!=='undefined'&&window.speechSynthesis)?window.speechSynthesis:null;
const narr={on:false,speaking:false,timer:null,warned:null};
try{narr.on=localStorage.getItem('narr')==='1';}catch(e){}
const SPK_ICON='<svg class="i-play" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><svg class="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
function spk(kind){return '<button class="spk" data-speak="'+kind+'" aria-label="'+t('nRead')+'" title="'+t('nRead')+'">'+SPK_ICON+'</button>';}
const plain=h=>String(h).replace(/<\/(p|li|h\d|div)>/gi,'. ').replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').replace(/\s+([.,!?])/g,'$1').replace(/([.!?])\s*\./g,'$1').trim();
function narrText(kind){
  if(kind==='guide')return plain(guideBody||'');
  if(kind==='journey'&&journey.active&&!journey.done){const s=JOURNEYS[journey.id].steps[journey.i];return nm(ORG[s.o])+'. '+s[lang];}
  if(kind==='cond'||(kind==='info'&&infoState.t==='cond')){
    if(!cond.active)return '';
    const c=CONDS.find(x=>x.id===cond.id);return c[lang].title+'. '+c.steps[cond.i][lang];
  }
  const s=infoState;
  if(s.t==='organ'){
    const o=ORG[s.id];
    return nm(o)+'. '+plain(fld(o,'desc'))+' '+t('kRole')+' '+plain(fld(o,'fn'))+
      (level>=2&&deepOf(o,'deep')?' '+plain(deepOf(o,'deep')):'')+(level>=3&&deepOf(o,'adv')?' '+plain(deepOf(o,'adv')):'')+
      ' '+t('kOrigin')+' '+plain(fld(o,'origin'))+' '+t('kFact')+' '+plain(fld(o,'fact'));
  }
  if(s.t==='sys')return sysName(s.k)+'. '+plain(sfld(s.k,'sum'))+' '+plain(sfld(s.k,'origin'))+' '+t('kFact')+' '+plain(sfld(s.k,'fact'));
  return plain(t('wTitle')+'. '+t('wP1')+' '+t('wP2')+' '+t('wP3'));
}
function toast(msg){const el=$('toast');el.textContent=msg;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>{el.style.display='none';},5000);}
function pickVoice(){
  const vs=SS.getVoices();if(!vs.length)return null;
  const ok=v=>{const l=(v.lang||'').toLowerCase();return lang==='he'?(l.startsWith('he')||l.startsWith('iw')):l.startsWith('en');};
  return vs.filter(ok).sort((a,b)=>(/natural|online/i.test(b.name)?1:0)-(/natural|online/i.test(a.name)?1:0))[0]||null;
}
const auto={on:false,timer:null};
try{auto.on=localStorage.getItem('auto')==='1';}catch(e){}
narr.token=0;
function setSpeaking(v){narr.speaking=v;document.body.classList.toggle('speaking',v);}
function stopSpeak(){narr.token++;clearTimeout(narr.timer);clearTimeout(auto.timer);if(SS)SS.cancel();setSpeaking(false);}
function speak(text,onDone){
  const tok=++narr.token;
  clearTimeout(auto.timer);
  const fin=()=>{if(tok!==narr.token)return;setSpeaking(false);if(onDone)onDone();};
  const est=()=>{setSpeaking(false);if(onDone)auto.timer=setTimeout(()=>{if(tok===narr.token)onDone();},Math.max(2500,(text||'').length*65));};
  if(!SS){toast(t('nNone'));est();return;}
  if(!text)return;
  SS.cancel();
  const v=pickVoice();
  if(!v&&SS.getVoices().length){toast(t(lang==='he'?'nNoHe':'nNoEn'));if(lang==='he'){est();return;}}
  const parts=(text.match(/[^.!?]+[.!?]*/g)||[text]).map(x=>x.trim()).filter(Boolean);
  const chunks=[];let cur='';
  parts.forEach(p=>{if((cur+' '+p).length>180&&cur){chunks.push(cur);cur=p;}else cur=cur?cur+' '+p:p;});
  if(cur)chunks.push(cur);
  setSpeaking(true);
  chunks.forEach((c,i)=>{
    const u=new SpeechSynthesisUtterance(c);
    u.lang=lang==='he'?'he-IL':'en-US';if(v)u.voice=v;u.rate=.95;
    if(i===chunks.length-1){u.onend=fin;u.onerror=fin;}
    SS.speak(u);
  });
}
function autoOpt(){return '<label class="opt"><span>'+t('aPlay')+'</span><input type="checkbox" data-auto '+(auto.on?'checked':'')+'></label>';}
function runStep(kind){
  clearTimeout(auto.timer);
  if(!auto.on){queueNarr(kind);return;}
  clearTimeout(narr.timer);
  narr.timer=setTimeout(()=>speak(narrText(kind),()=>{auto.timer=setTimeout(()=>autoNext(kind),2000);}),250);
}
function autoNext(kind){
  if(!auto.on)return;
  if(kind==='journey'){
    if(!journey.active||journey.done)return;
    const n=JOURNEYS[journey.id].steps.length;
    if(journey.i+1>=n){journey.done=true;selected=null;showWelcome();resetCam();renderJourney();}else setStep(journey.i+1);
  }else{
    if(!cond.active)return;
    const n=CONDS.find(x=>x.id===cond.id).steps.length;
    if(cond.i+1>=n)stopCond();else condStep(cond.i+1);
  }
}
document.addEventListener('change',e=>{
  const c=e.target&&e.target.closest?e.target.closest('[data-auto]'):null;if(!c)return;
  auto.on=c.checked;try{localStorage.setItem('auto',auto.on?'1':'0');}catch(err){}
  if(!auto.on)stopSpeak();
  renderJourney();renderCond();
  if(auto.on){if(journey.active&&!journey.done)runStep('journey');else if(cond.active)runStep('cond');}
});
function queueNarr(kind){
  if(!narr.on||quiz.active||!SS)return;
  clearTimeout(narr.timer);
  narr.timer=setTimeout(()=>speak(narrText(kind)),200);
}
function syncNarrBtn(){
  const b=$('bNarr');b.classList.toggle('on',narr.on);b.setAttribute('aria-pressed',narr.on?'true':'false');
  b.title=t(narr.on?'nOn':'nOff');b.setAttribute('aria-label',t(narr.on?'nOn':'nOff'));
}
$('bNarr').onclick=()=>{

/* ===================== RESPONSIVE VIEW ===================== */
const GRIP_ICONS={tall:'<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',close:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'};
function GRIP(w){return '<div class="grip"><button data-tall="'+w+'" aria-label="Expand">'+GRIP_ICONS.tall+'</button><button data-close="'+w+'" aria-label="Close">'+GRIP_ICONS.close+'</button></div>';}
sheet.insertAdjacentHTML('afterbegin',GRIP('sheet'));
document.addEventListener('click',e=>{
  const c=e.target.closest&&e.target.closest('[data-close]');
  if(c){if(c.dataset.close==='sheet')closeSheet();else{selected=null;showWelcome();infoEl.classList.add('dismissed');}return;}
  const tl=e.target.closest&&e.target.closest('[data-tall]');
  if(tl)(tl.dataset.tall==='sheet'?sheet:infoEl).classList.toggle('tall');
});
const view={x:0,y:0,tx:0,ty:0,n:0,last:''};
function viewTargets(){
  const W=stage.clientWidth,H=stage.clientHeight;if(!W||!H)return;
  let L=0,R=0;
  const top=Math.min($('top').getBoundingClientRect().bottom,H*.2);
  let bottom=Math.max(0,H-$('nav').getBoundingClientRect().top);
  [sheet,infoEl].forEach(el=>{
    if(!el.offsetHeight)return;
    const r=el.getBoundingClientRect();
    if(r.width>W*.6)bottom=Math.max(bottom,H-r.top);
    else if(r.left+r.width/2<W/2)L=Math.max(L,r.right);else R=Math.max(R,W-r.left);
  });
  view.tx=Math.max(-W*.3,Math.min(W*.3,-(L-R)/2));
  view.ty=Math.max(-H*.3,Math.min(H*.3,(bottom-top)/2));
}
function viewTick(dt){
  if(view.n++%8===0)viewTargets();
  const k=1-Math.exp(-dt*6);
  view.x+=(view.tx-view.x)*k;view.y+=(view.ty-view.y)*k;
  const w=stage.clientWidth,h=stage.clientHeight;
  const key=Math.round(view.x)+'|'+Math.round(view.y)+'|'+w+'|'+h;
  if(key===view.last)return;view.last=key;
  if(Math.abs(view.x)<.5&&Math.abs(view.y)<.5)camera.clearViewOffset();
  else camera.setViewOffset(w,h,view.x,view.y,w,h);
}
